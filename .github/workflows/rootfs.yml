name: 🌀 Build Debian 13 GNOME Dual

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本，如 7.1'
        required: true
        default: '7.1'
      mesa_release_tag:
        description: 'Mesa 驱动 Release tag，留空则不内置 Mesa Freedreno/Turnip'
        required: false
        default: ''
      skip_release:
        description: '跳过创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: code002-2/Xiaomi-pad-6s-pro-Linux

jobs:
  build-debian:
    name: Build Debian 13 GNOME Dual
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4

      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          TAG="debian13-gnome-dual-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy build environment
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y \
            ca-certificates \
            curl \
            wget \
            gh \
            debootstrap \
            e2fsprogs \
            util-linux \
            psmisc \
            libarchive-tools \
            p7zip-full \
            xz-utils \
            android-sdk-libsparse-utils

      - name: Download kernel bundle from upstream
        shell: bash
        run: |
          set -e

          KERNEL_VER="${{ inputs.kernel_version }}"

          echo "Using upstream repo: ${UPSTREAM_REPO}"
          echo "Kernel version: ${KERNEL_VER}"

          rm -f ./*.deb

          if gh release download "kernel-bundle-${KERNEL_VER}" \
            --pattern "*.deb" \
            --repo "${UPSTREAM_REPO}" \
            --clobber; then
            echo "Downloaded from tag: kernel-bundle-${KERNEL_VER}"
          elif gh release download "kernel-${KERNEL_VER}" \
            --pattern "*.deb" \
            --repo "${UPSTREAM_REPO}" \
            --clobber; then
            echo "Downloaded from tag: kernel-${KERNEL_VER}"
          else
            echo "❌ 无法从上游仓库下载内核 deb 包。"
            echo "请检查上游 Release 是否存在 kernel-bundle-${KERNEL_VER} 或 kernel-${KERNEL_VER}。"
            exit 1
          fi

          echo "Downloaded kernel bundle deb packages:"
          ls -lh ./*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Mesa Freedreno Turnip driver
        if: ${{ inputs.mesa_release_tag != '' }}
        shell: bash
        run: |
          set -e

          echo "Mesa release tag: ${{ inputs.mesa_release_tag }}"

          gh release download "${{ inputs.mesa_release_tag }}" \
            --pattern "mesa-freedreno-turnip-opt_*_arm64.deb" \
            --repo "${{ github.repository }}" \
            --clobber

          echo "Downloaded Mesa deb:"
          ls -lh mesa-freedreno-turnip-opt_*_arm64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RootFS
        id: build
        shell: bash
        run: |
          set -e

          chmod +x sheng-rootfs_build.sh

          sudo bash sheng-rootfs_build.sh \
            debian-desktop \
            "${{ inputs.kernel_version }}" \
            dual \
            gnome

          PKG_COUNT=$(find . -maxdepth 1 -name "*.7z" -type f | wc -l)
          echo "pkg_count=$PKG_COUNT" >> "$GITHUB_OUTPUT"

          echo "Generated packages:"
          find . -maxdepth 1 -name "*.7z" -type f -print -exec ls -lh {} \;

      - name: Upload artifact
        if: ${{ steps.build.outputs.pkg_count > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: debian13-gnome-dual
          path: "*.7z"
          retention-days: 7
          if-no-files-found: error

      - name: Create Release and upload image
        if: ${{ inputs.skip_release != true && steps.build.outputs.pkg_count > 0 }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "Debian 13 GNOME Dual - ${{ steps.tag.outputs.release_tag }}"
          body: |
            🌀 Debian 13 (Trixie) GNOME Desktop For Xiaomi Pad 6S Pro / SM8550

            ---

            ### 📋 构建信息

            | 参数 | 详情 |
            |------|------|
            | 架构 | ARM64 / arm64 |
            | 发行版 | Debian 13 / trixie |
            | 桌面环境 | GNOME |
            | 启动模式 | dual |
            | 内核版本 | ${{ inputs.kernel_version }} |
            | Mesa 驱动 | ${{ inputs.mesa_release_tag || '未内置' }} |
            | 上游仓库 | code002-2/Xiaomi-pad-6s-pro-Linux |

            ---

            ### 🔐 默认凭据

            - 普通用户: `misaka10843`
            - 普通用户密码: `misaka10843`
            - root 密码: `misaka10843`

            ---

            ### 📦 镜像文件

            本 workflow 仅构建 GNOME + dual 双系统模式镜像。
          files: "*.7z"
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}