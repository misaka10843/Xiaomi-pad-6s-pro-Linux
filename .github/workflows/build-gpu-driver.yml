name: 构建 Mesa Freedreno Turnip 驱动

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa 分支、tag 或 commit，如 main、25.1、25.2'
        required: true
        default: '25.2'
      build_type:
        description: '构建类型'
        type: choice
        options:
          - release
          - debug
        default: 'release'
      freedreno_kmds:
        description: 'Freedreno KMD 后端，SM8550/Android 内核建议 msm,kgsl'
        required: true
        default: 'msm,kgsl'
      skip_release:
        description: '跳过创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-mesa-freedreno-turnip:
    name: Build Mesa Freedreno Turnip deb
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ca-certificates \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-mako \
            python3-ply \
            python3-yaml \
            python3-pycparser \
            ninja-build \
            pkg-config \
            pkgconf \
            flex \
            bison \
            glslang-tools \
            spirv-tools \
            libdrm-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxdamage-dev \
            libxcb-glx0-dev \
            libxcb-shm0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxfixes-dev \
            libwayland-dev \
            wayland-protocols \
            libwayland-egl-backend-dev \
            libvulkan-dev \
            libelf-dev \
            libexpat1-dev \
            libzstd-dev \
            libglvnd-dev \
            libunwind-dev \
            dpkg-dev \
            fakeroot \
            xz-utils \
            zstd

      - name: Upgrade Meson
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Clone Mesa source
        shell: bash
        run: |
          set -e

          MESA_REF="${{ inputs.mesa_ref }}"

          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-source || {
              echo "浅克隆分支或 tag 失败，尝试按 commit 拉取..."
              git clone https://gitlab.freedesktop.org/mesa/mesa.git mesa-source
              cd mesa-source
              git checkout "$MESA_REF"
            }

          cd mesa-source

          MESA_COMMIT="$(git rev-parse --short HEAD)"
          MESA_VERSION_SAFE="$(echo "$MESA_REF" | tr '/_' '--' | tr -cd 'A-Za-z0-9.+-')"

          echo "MESA_COMMIT=${MESA_COMMIT}" >> "$GITHUB_ENV"
          echo "MESA_VERSION_SAFE=${MESA_VERSION_SAFE}" >> "$GITHUB_ENV"

      - name: Configure Mesa
        shell: bash
        run: |
          set -e

          cd mesa-source

          meson setup builddir \
            --prefix=/opt/mesa-freedreno \
            --libdir=lib/aarch64-linux-gnu \
            --buildtype=${{ inputs.build_type }} \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,swrast \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=${{ inputs.freedreno_kmds }} \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=dri \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dshared-glapi=enabled \
            -Dllvm=disabled \
            -Dvalgrind=disabled

      - name: Compile Mesa
        shell: bash
        run: |
          cd mesa-source
          ninja -C builddir

            - name: Package deb
        shell: bash
        run: |
          set -e

          cd mesa-source

          PKG_ROOT="$(pwd)/pkgroot"
          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT"

          DESTDIR="$PKG_ROOT" ninja -C builddir install

          mkdir -p "$PKG_ROOT/etc/profile.d"
          mkdir -p "$PKG_ROOT/etc/ld.so.conf.d"
          mkdir -p "$PKG_ROOT/etc/environment.d"
          mkdir -p "$PKG_ROOT/DEBIAN"

          printf '%s\n' \
            '/opt/mesa-freedreno/lib/aarch64-linux-gnu' \
            > "$PKG_ROOT/etc/ld.so.conf.d/mesa-freedreno.conf"

          {
            echo 'MESA_HOME=/opt/mesa-freedreno'
            echo 'LIBGL_DRIVERS_PATH=/opt/mesa-freedreno/lib/aarch64-linux-gnu/dri'
            echo 'GBM_BACKENDS_PATH=/opt/mesa-freedreno/lib/aarch64-linux-gnu/gbm'
            echo '__EGL_VENDOR_LIBRARY_DIRS=/opt/mesa-freedreno/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d'
          } > "$PKG_ROOT/etc/environment.d/90-mesa-freedreno.conf"

          {
            echo '# Mesa Freedreno / Turnip installed in /opt/mesa-freedreno'
            echo ''
            echo 'if [ -d /opt/mesa-freedreno ]; then'
            echo '    export MESA_HOME=/opt/mesa-freedreno'
            echo '    export LD_LIBRARY_PATH=/opt/mesa-freedreno/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}'
            echo '    export LIBGL_DRIVERS_PATH=/opt/mesa-freedreno/lib/aarch64-linux-gnu/dri'
            echo '    export GBM_BACKENDS_PATH=/opt/mesa-freedreno/lib/aarch64-linux-gnu/gbm'
            echo '    export __EGL_VENDOR_LIBRARY_DIRS=/opt/mesa-freedreno/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d'
            echo ''
            echo '    if [ -f /opt/mesa-freedreno/share/vulkan/icd.d/freedreno_icd.aarch64.json ]; then'
            echo '        export VK_ICD_FILENAMES=/opt/mesa-freedreno/share/vulkan/icd.d/freedreno_icd.aarch64.json'
            echo '    elif [ -f /opt/mesa-freedreno/share/vulkan/icd.d/freedreno_icd.arm64.json ]; then'
            echo '        export VK_ICD_FILENAMES=/opt/mesa-freedreno/share/vulkan/icd.d/freedreno_icd.arm64.json'
            echo '    fi'
            echo 'fi'
          } > "$PKG_ROOT/etc/profile.d/mesa-freedreno.sh"

          DEB_VERSION="0.0.0+${MESA_VERSION_SAFE}+git${MESA_COMMIT}"

          {
            echo 'Package: mesa-freedreno-turnip-opt'
            echo "Version: ${DEB_VERSION}"
            echo 'Architecture: arm64'
            echo 'Maintainer: GitHub Actions <actions@github.com>'
            echo 'Section: libs'
            echo 'Priority: optional'
            echo 'Depends: libc6, libdrm2, libx11-6, libx11-xcb1, libxext6, libxdamage1, libxcb-glx0, libxcb-shm0, libxcb-dri2-0, libxcb-dri3-0, libxcb-present0, libxcb-randr0, libxcb-sync1, libxcb-xfixes0, libxshmfence1, libxxf86vm1, libxrandr2, libxfixes3, libwayland-client0, libwayland-server0, libvulkan1, libexpat1, libzstd1, libglvnd0'
            echo 'Description: Mesa Freedreno OpenGL and Turnip Vulkan drivers installed under /opt'
            echo " Built from Mesa ref ${{ inputs.mesa_ref }}, commit ${MESA_COMMIT}."
            echo ' This package does not replace Debian system Mesa files directly.'
          } > "$PKG_ROOT/DEBIAN/control"

          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo 'ldconfig || true'
            echo 'exit 0'
          } > "$PKG_ROOT/DEBIAN/postinst"
          chmod 0755 "$PKG_ROOT/DEBIAN/postinst"

          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo 'ldconfig || true'
            echo 'exit 0'
          } > "$PKG_ROOT/DEBIAN/postrm"
          chmod 0755 "$PKG_ROOT/DEBIAN/postrm"

          cd "$PKG_ROOT"
          find opt etc -type f -exec md5sum {} \; > DEBIAN/md5sums
          cd ..

          fakeroot dpkg-deb --build "$PKG_ROOT" "mesa-freedreno-turnip-opt_${DEB_VERSION}_arm64.deb"

          mkdir -p ../out
          mv mesa-freedreno-turnip-opt_*_arm64.deb ../out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-freedreno-turnip-opt
          path: out/mesa-freedreno-turnip-opt_*_arm64.deb
          retention-days: 14
          if-no-files-found: error

      - name: Create Release and upload deb
        if: ${{ inputs.skip_release != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesa-freedreno-turnip-${{ env.MESA_VERSION_SAFE }}-${{ env.MESA_COMMIT }}
          name: "Mesa Freedreno Turnip - ${{ inputs.mesa_ref }}"
          body: |
            Built from Mesa ref `${{ inputs.mesa_ref }}`, commit `${{ env.MESA_COMMIT }}`.

            包含：

            - Freedreno OpenGL / OpenGL ES
            - Turnip Vulkan
            - KMD backend: `${{ inputs.freedreno_kmds }}`
            - 安装路径: `/opt/mesa-freedreno`

            这个包不会直接覆盖 Debian 系统 Mesa 文件。
          files: out/mesa-freedreno-turnip-opt_*_arm64.deb
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
